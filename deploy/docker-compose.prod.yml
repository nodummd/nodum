# ============================================================
# Production
# ============================================================
# Usage: ./compose.sh prod up -d --build
#
# Everything substantive lives in docker-compose.deploy.yml, which staging
# shares — so staging is a real mirror instead of a lookalike that drifts.
# This file carries only what must differ between the two: container names and
# the ports the edge proxy publishes.
#
# Requires deploy/.env.prod (copy .env.prod.example). The API refuses to boot
# on placeholder or default credentials.
# ============================================================

services:
  postgres:
    container_name: nodum-prod-postgres

  redis:
    container_name: nodum-prod-redis

  redis-control:
    container_name: nodum-prod-redis-control

  minio:
    container_name: nodum-prod-minio

  migrate:
    container_name: nodum-prod-migrate

  api:
    container_name: nodum-prod-api

  celery-worker:
    container_name: nodum-prod-celery-worker

  celery-beat:
    container_name: nodum-prod-celery-beat

  web:
    container_name: nodum-prod-web

  caddy:
    container_name: nodum-prod-caddy
    # The only host ports in the whole stack. Override NODUM_HTTP_PORT /
    # NODUM_HTTPS_PORT to verify production locally beside a running dev stack,
    # or when something else already owns 80/443 on the host.
    ports:
      - "${NODUM_HTTP_PORT:-80}:80"
      - "${NODUM_HTTPS_PORT:-443}:443"
      # HTTP/3. Harmless when unused; Caddy negotiates down.
      - "${NODUM_HTTPS_PORT:-443}:443/udp"
