name: Contributors

# Keeps the README's contributors table in step with the repository's actual
# contributor list. It used to be hand-maintained, and the instruction to "copy
# the <td> above" was duly forgotten — the CLI shipped in v3.11.0 with its
# author missing from the README.
#
# Runs after anything lands on dev or main, plus daily (GitHub's contributor
# list is itself computed on a delay, so a push-time run can miss a first-time
# contributor) and on demand.

on:
  push:
    branches: [main, dev]
  schedule:
    # 05:41 UTC — off the hour, where every other scheduled job piles up.
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributors
  cancel-in-progress: false

jobs:
  update:
    name: Refresh the contributors table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always onto dev: it is the integration branch, and main takes the
      # change with the next release like everything else.
      #
      # fetch-depth 0 and an explicit fetch, because a run triggered by the
      # very push that added this workflow checked out a dev that did not have
      # the script yet — the ref moves a moment after the event fires.
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Take the current tip of dev
        run: |
          git fetch origin dev
          git checkout -B dev origin/dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A run can outrun the merge that adds or changes the script; there is
      # nothing to do until dev actually carries it.
      - name: Regenerate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f scripts/update-contributors.mjs ]; then
            echo "dev has no scripts/update-contributors.mjs yet — nothing to do"
            exit 0
          fi
          node scripts/update-contributors.mjs

      - name: Open a PR if it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.md; then
            echo "contributors table already current"
            exit 0
          fi

          branch="chore/contributors-$(date -u +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add README.md
          git commit -m "docs(readme): refresh the contributors table"
          git push origin "$branch"

          # A PR rather than a push to dev: the branch rulesets require one,
          # and GitHub refuses to let the Actions app bypass them. An existing
          # open PR is replaced, so a run a day does not pile them up.
          gh pr list --state open --search "in:title refresh the contributors table" \
            --json number --jq '.[].number' | xargs -r -n1 gh pr close --delete-branch
          gh pr create --base dev --head "$branch" \
            --title "docs(readme): refresh the contributors table" \
            --body "Generated by \`scripts/update-contributors.mjs\` from the repository's contributor list. Roles come from \`.github/contributor-roles.json\`; a contributor with no entry there still gets a card, without the role line."
