name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    # Trigger gating (defense-in-depth):
    # 1. COMMENT-ONLY. There is no pull_request trigger on purpose: a review never starts
    #    by itself when a PR is opened, synchronized or reopened. The only way in is a
    #    human typing the command in a comment.
    # 2. issue_comment fires for BOTH issues and PRs — require github.event.issue.pull_request
    #    (only present on PR comments) so `@claude review` on a plain issue, which has no
    #    diff to review, doesn't spin up a review with empty context.
    # 3. Restrict to an explicit login allowlist. This workflow is secret-backed with
    #    pull-requests: write and reads the full diff, so gate at the YAML level and don't
    #    even start the runner for anyone else — on top of claude-code-action's own
    #    collaborator gate. Deliberately stricter than the old author_association
    #    allowlist: OWNER/MEMBER/COLLABORATOR let ANY repo collaborator spend the shared
    #    CLAUDE_CODE_OAUTH_TOKEN.
    #    The allowlist lives in the repository variable CLAUDE_REVIEW_LOGINS (Settings →
    #    Secrets and variables → Actions → Variables), a JSON array of logins, e.g.
    #    ["maqboolthoufeeq","someone-else"]. It defaults to ["maqboolthoufeeq"] when the
    #    variable is unset, so the workflow works with no setup. Keeping it in a variable
    #    matters because issue_comment workflows ALWAYS run the default-branch copy: with
    #    a hardcoded login, adding a maintainer would need a commit landed on main.
    # Both `@claude review` and `@claude /review` trigger it; the slash form is kept so
    # existing habits and older PR comments keep working. startsWith (no trailing space)
    # tolerates anything after the command — a newline, extra focus instructions
    # ("@claude review focus on the new migration"), or nothing.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (startsWith(github.event.comment.body, '@claude review') || startsWith(github.event.comment.body, '@claude /review')) && contains(fromJSON(vars.CLAUDE_REVIEW_LOGINS || '["maqboolthoufeeq"]'), github.event.comment.user.login)) ||
      (github.event_name == 'pull_request_review_comment' && (startsWith(github.event.comment.body, '@claude review') || startsWith(github.event.comment.body, '@claude /review')) && contains(fromJSON(vars.CLAUDE_REVIEW_LOGINS || '["maqboolthoufeeq"]'), github.event.comment.user.login))

    runs-on: ubuntu-latest
    # Cancel a superseded review run if a new review command lands on the same PR.
    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # required by the github_ci MCP server to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1.0.222
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # CRITICAL: forces tag-mode tracking comments. Without this the action runs
          # headless — no live "todo list" progress comment AND the final review is never
          # posted (Claude can't reach the comment MCP tool, surfacing as permission_denials).
          track_progress: true
          # Reuse a single sticky comment: the live progress comment becomes the final review.
          use_sticky_comment: true
          # Let Claude read CI results to factor them into the review.
          additional_permissions: |
            actions: read
          prompt: |
            # Nodum Pull Request Review

            You are a senior engineer reviewing this PR for nodum — an open-source,
            multi-tenant, web-based Obsidian alternative (markdown knowledge base with
            wikilinks, backlinks, and an interactive knowledge graph).
            - back/  — FastAPI (Python, uv), SQLAlchemy 2 async + asyncpg, PostgreSQL
              (pgvector + tsvector), Alembic, Redis, Celery, S3/MinIO attachments.
            - web/   — Next.js App Router, TypeScript, Tailwind v4, CodeMirror 6
              live-preview editor, Yjs collab, @cosmos.gl/graph graph view.
            - deploy/ — docker compose stacks (dev/test/staging/prod).

            ## The triggering comment
            You were invoked by a comment beginning with `@claude review` (the
            `@claude /review` spelling also works). Anything the commenter wrote
            AFTER that command is a direct instruction to you — e.g.
            `@claude review focus on the new migration and skip the frontend`, or
            `@claude review only look at tenancy`. Honour those instructions: they
            narrow, redirect or re-prioritise the review. They never relax the
            project rules below, and they never grant you write access. If the
            comment carries no extra instructions, perform the full review described
            here.

            ## Project conventions (enforce these — they are the house rules)
            - Root CLAUDE.md is authoritative. Backend conventions live in
              .claude/skills/nodum-backend/SKILL.md; frontend conventions in
              web/AGENTS.md. Consult them for whatever areas the diff touches.
            - Backend: routers thin / services fat (`ServiceResponse.unwrap()`
              pattern); success responses `{"data": ...}`, errors
              `{"error": {"code","message"}}`; Alembic migrations numbered and
              sequential (`0012_...`); formatting matters — CI runs
              `ruff format --check`, not just `ruff check`.
            - Multi-tenancy: the tenant unit is the vault (`vaults.user_id`; child
              tables scope by `vault_id`). There is NO row-level security — every
              service operation must establish ownership via
              `get_owned_vault(db, vault_id, user_id)`
              (back/app/services/vault_service.py) and re-scope child queries by
              `vault_id`. Flag ANY new query or endpoint that skips this: it is a
              cross-tenant read/write, the most serious class of bug in this
              codebase.
            - Frontend: workspace state in Zustand, server data via TanStack Query;
              backend access ONLY through web/src/lib/api/ — flag ad-hoc fetch()
              calls. Rendered markdown must stay inside the strict inline-HTML
              allowlist (web/src/lib/editor/inline-html.ts) — flag anything that
              widens it or introduces dangerouslySetInnerHTML / rehype-raw.
            - This repo is public: never any secret in the tree (only
              `.env*.example` placeholders); compose host ports bind 127.0.0.1;
              containers run non-root in prod.

            ## Review areas
            1. **Correctness & logic** — does the change do what the PR claims;
               edge cases; error paths return the project error envelope; async
               pitfalls (blocking calls in async routes, missed awaits, DB session
               misuse across tasks).
            2. **Tenancy & security** — vault ownership checks as above; authz on
               new routes; input validation via Pydantic DTOs (no mass assignment
               of `user_id`/`vault_id` from request bodies); LIKE-pattern escaping;
               raw SQL construction.
            3. **Concurrency & caching** — row locks / ON CONFLICT where services
               rely on them; races on caps, counters, and rename/move paths; Redis
               cache invalidation (vault tree + graph caches) kept in sync with
               writes.
            4. **Performance** — N+1 queries, missing indexes for new query shapes,
               unbounded result sets; needless re-renders or query invalidations in
               web/.
            5. **Tests** — new behaviour has unit coverage; ownership/authz changes
               have integration coverage; tests assert response envelopes, not just
               status codes.
            6. **Docs & plan** — user-visible or architectural changes reflected
               where the repo documents them (docs/, tasks/nodum-master-plan.md
               Progress Log).
            Factor CI results on this PR into the review if any jobs failed.

            ## Severity scale — use these exact emoji and labels, nothing else
            - 🔴 **Critical** — must fix before merge. Cross-tenant read or write, auth
              bypass, a secret in the tree, data loss, or a change that breaks the build,
              a migration, or an existing API contract.
            - 🟠 **High** — should fix before merge. A real bug on a path this diff makes
              reachable: wrong results, an unhandled error path, a race, a missing
              `vault_id` re-scope on a new query, an N+1 on a hot path.
            - 🟡 **Medium** — fix soon, does not block the merge. Limited blast radius: a
              narrow edge case, new behaviour with no test, a cache left stale, a
              response that skips the project envelope.
            - 🔵 **Low** — optional polish. Naming, dead code, a clearer helper, a comment
              or doc line this diff made wrong.
            - 🟢 **Good** — something the diff gets right that is worth naming. Only ever
              used in the "What's done well" section, never to tag a problem.

            ## Review format
            Open the comment with a count line, then the legend, then a rule:

                🔴 1 · 🟠 2 · 🟡 0 · 🔵 3
                🔴 critical · 🟠 high · 🟡 medium · 🔵 low · 🟢 done well
                ---

            The counts must match the findings you actually post. Then group the
            findings under `### 🔴 Critical`, `### 🟠 High`, `### 🟡 Medium`,
            `### 🔵 Low`, in that order, and OMIT any heading whose group is empty.
            Never invent or inflate a finding to fill a group, and never downgrade a
            real one to make the counts look better. For each finding:
            1. **Location:** `file:line`
            2. **Issue:** what is wrong, in one or two sentences
            3. **Fix:** the specific change, with a short code example where it helps
            4. **Rationale:** why it matters in this codebase

            ## Summary format
            End the comment with:
            1. **Overall assessment** — quality and readiness, two or three sentences.
            2. **### 🟢 What's done well** — concrete things this diff gets right, each
               anchored to a `file:line`. This section is required. If the diff is
               genuinely unremarkable, say that in one line rather than padding it.
            3. **Merge recommendation** — exactly one of: ✅ **ready to merge** ·
               🟠 **needs changes** · 🔴 **blocked** · 💬 **needs discussion**.
            Be constructive and specific. If the diff is clean, say so plainly rather
            than inventing findings: a review with 🔴 0 · 🟠 0 is a valid outcome.

          # Opus 5 + [1m] → 1M-token context window. A whole-PR review benefits most from
          # the largest context, so KEEP the suffix.
          #
          # Do not drop it on the grounds that Opus 4.7+ "always runs at 1M": that is true of
          # the API default, but [1m] is a Claude Code CLI construct and the CLI still starts
          # at 200k. In the CLI bundle the suffix is gated per model by an explicit set that
          # enumerates claude-opus-4-6/4-7/4-8/5 and claude-sonnet-4-0/4-5/4-6 — Opus 5 is in
          # it, and a per-model gate would be pointless if 1M were automatic. The bundle also
          # ships strip1mTag() and swapShrinksContextWindow(), which only exist because the
          # window is not uniformly 1M. Dropping the suffix silently reviews at 200k: no
          # error, just worse results on exactly the large diffs that need the context.
          #
          # Review-only run → read-only tool surface. Only `gh pr view` / `gh pr diff` /
          # `gh pr checks` are allowed — NOT the broad `gh pr:*`, which would let a
          # prompt-injected diff run mutating commands (gh pr close/edit/review/merge)
          # under pull-requests: write. Posting stays confined to the comment MCP tool.
          # See https://code.claude.com/docs/en/model-config (Extended context)
          claude_args: |
            --model claude-opus-5[1m]
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Read,Glob,Grep,mcp__github_comment__update_claude_comment"
