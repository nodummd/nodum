name: Docker

on:
  push:
    branches: [main, dev]
    paths:
      - "back/**"
      - "web/**"
      - "deploy/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "back/**"
      - "web/**"
      - "deploy/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    name: Validate compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # A typo in a compose file is otherwise found by an operator mid-deploy.
      # Every environment renders from its own example, which also proves each
      # example still carries every variable its compose files interpolate —
      # the `${VAR:?}` entries fail the render the moment one goes missing.
      - name: Render every environment
        working-directory: deploy
        run: |
          cp .env.example .env
          # staging/prod examples ship their secrets blank on purpose, and
          # `${VAR:?}` treats empty as unset. Fill them the way an operator
          # would, so this validates a *completed* example rather than a
          # half-configured one.
          for env in staging prod; do
            sed -e "s|^SECRET_KEY=$|SECRET_KEY=$(openssl rand -hex 32)|" \
                -e "s|^JWT_SECRET_KEY=$|JWT_SECRET_KEY=$(openssl rand -hex 32)|" \
                -e "s|^POSTGRES_PASSWORD=$|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" \
                -e "s|^MINIO_ROOT_PASSWORD=$|MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)|" \
                ".env.$env.example" > ".env.$env"
          done
          for env in dev test staging prod; do
            echo "── $env ──"
            ./compose.sh "$env" config --quiet
          done

      # The proxy config is the one file compose cannot check for us, and a
      # broken Caddyfile takes the whole site down rather than one service.
      - name: Validate the Caddyfile
        working-directory: deploy
        run: |
          docker run --rm -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  build-scan:
    name: Build & scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: back
            dockerfile: back/build/Dockerfile.api
          - name: web
            context: web
            dockerfile: web/docker/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The production images were never built in CI, so a broken Dockerfile
      # only surfaced during a deploy. Loaded into the local daemon rather than
      # pushed — this validates the build and feeds the scanner, it does not
      # publish anything.
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: production
          load: true
          tags: nodum-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # ignore-unfixed: base-image CVEs with no upstream patch are not
      # actionable, and a gate that cannot be made green is a gate everyone
      # learns to skip. This fails only on something we can actually fix.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nodum-${{ matrix.name }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Confirm the image does not run as root
        run: |
          user=$(docker image inspect nodum-${{ matrix.name }}:ci --format '{{.Config.User}}')
          echo "USER=${user:-<empty>}"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::nodum-${{ matrix.name }} production image runs as root"
            exit 1
          fi

      - name: Confirm no secrets were baked into the image
        run: |
          if docker run --rm --entrypoint sh nodum-${{ matrix.name }}:ci -c 'ls -a /app/.env /app/.git 2>/dev/null' | grep -q .; then
            echo "::error::nodum-${{ matrix.name }} image contains .env or .git"
            exit 1
          fi
          echo "clean"
