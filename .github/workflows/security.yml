name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # A dependency that was clean on merge is not clean forever — advisories
    # land against versions already in the lockfile.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: back/uv.lock

      # Audit what actually ships: --no-dev keeps a pytest advisory from
      # failing a production gate.
      - name: Export runtime dependencies
        working-directory: back
        run: uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt -o requirements.txt

      - name: pip-audit
        working-directory: back
        run: uvx pip-audit@2.9.0 -r requirements.txt

  node-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --omit=dev for the same reason: an advisory in build tooling is worth
      # knowing about but is not shipped to a user, and a gate that fails on
      # things you cannot act on gets ignored.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needs the dependency graph, which on a private repo requires Advanced
    # Security. Turns on by itself when the repo goes public.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.repository.visibility == 'public'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # The action hard-fails with "Dependency review is not supported on this
      # repository" when the dependency graph is off — a repo setting, not
      # anything about the code. Probing the same endpoint it uses lets the job
      # skip cleanly instead of sitting permanently red, and it starts working
      # by itself the moment the graph is enabled, with no workflow change.
      - name: Is the dependency graph available?
        id: depgraph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          if [ "$code" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependency graph unavailable (HTTP $code). Enable it under Settings → Code security → Dependency graph; this job will start running on its own."
          fi

      - uses: actions/dependency-review-action@v5.0.0
        if: steps.depgraph.outputs.available == 'true'
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
