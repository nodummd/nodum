[project]
name = "nodum"
version = "0.1.0"
description = "Nodum — open-source web knowledge base with linked notes and a knowledge graph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
    # Database
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    # Validation & settings
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    # Auth
    # PyJWT, not python-jose: python-jose is effectively unmaintained and drags
    # in `ecdsa`, which carries an unfixable timing-attack advisory
    # (PYSEC-2026-1325 — upstream states it is not side-channel resistant and
    # will not be). PyJWT covers every algorithm in _ALLOWED_JWT_ALGORITHMS
    # using `cryptography`, and drops ecdsa/rsa/pyasn1 from the tree entirely.
    "pyjwt>=2.10.1",
    # Fernet, for encrypting users' AI provider keys at rest, and PyJWT's
    # backend for the RS* algorithms.
    "cryptography>=50.0.0",
    "argon2-cffi>=25.1.0",
    # Redis — still capped: kombu 5.6.2 (celery's transport layer) declares
    # `redis!=4.5.5,!=5.0.2,<6.5,>=4.5.2`, so redis 8.x cannot be resolved no
    # matter what we ask for. The cap is kept explicit so the ceiling is
    # visible here rather than surfacing as a mystery during a later upgrade.
    # Re-check with `grep Requires-Dist: redis .venv/.../kombu-*/METADATA`.
    "redis[hiredis]>=6.4.0,<6.5",
    # HTTP client
    "httpx>=0.28.1",
    # Background jobs (vault import/export, unlinked-mention scans)
    "celery[redis]>=5.6.3",
    # Object storage (attachments)
    "boto3>=1.43.72",
    # Markdown / frontmatter parsing
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    # Import converters. Evernote's ENML, Google Keep's Takeout HTML, Apple
    # Notes and generic web clippings are all HTML, and hand-rolling
    # HTML→markdown is a well-known tarpit — markdownify does it properly.
    "markdownify>=1.2.0",
    # Every import parses a file a stranger uploaded. ElementTree resolves no
    # external entities but is still open to entity-expansion (billion laughs);
    # defusedxml closes that, and ENEX imports are pure XML.
    "defusedxml>=0.7.1",
    # Logging & monitoring
    "structlog>=26.1.0",
    "sentry-sdk[fastapi]>=2.68.0",
    # Utilities
    "uuid7>=0.1.0",
    "pgvector>=0.5.0",
    "pycrdt>=0.14.2",
    "pycrdt-websocket>=0.16.4",
    "pypdf>=6.16.1",
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.16.3",
    "httpx-ws>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run — the app's global async engine pools
# connections that must not cross loops.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
