[project]
name = "nodum-cli"
version = "0.1.0"
description = "CLI for managing a Nodum Docker Compose stack"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
nodum = "nodum_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["nodum_cli"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "TC003",   # Path used at runtime (compose.sh invocation)
]

[tool.ruff.lint.isort]
known-first-party = ["nodum_cli"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "pytest>=8.0",
]
